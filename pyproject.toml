[project]
name = "ccmon"
version = "0.1.0"
description = "Claude Code session monitor (CLI is cross-platform; tray + pet are Windows-only)"
readme = "README.md"
requires-python = ">=3.11"
# The CLI (`ccmon ps`, webhook delivery) runs anywhere with Python 3.11+.
# Tray and desktop pet are Windows-only -- the optional deps below use
# sys_platform markers so install on Linux pulls only the cross-platform bits.
classifiers = [
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "psutil>=7.0",
    "pillow>=11.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.28",
]

[project.optional-dependencies]
tray = ["pystray>=0.19", "pywin32>=306; sys_platform=='win32'", "winotify>=1.1"]
pet = ["PySide6>=6.7"]
dev = ["pytest>=8.0"]

[project.scripts]
ccmon = "ccmon.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ccmon"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
